{% extends 'base.html' %}{% block title %}Smart Pantry · PandaCrumbs{% endblock %}{% block content %}
<div class="page-heading flex items-center justify-between"><h1>Smart Pantry</h1><a class="button outline" href="{% url 'pantry:add' %}">+ Tambah Bahan Makanan</a></div>
<form class="pantry-filters" method="get" data-filter-form data-target="results"><div class="search-row flex"><label class="sr-only" for="pantry-search">Cari bahan makanan</label><input id="pantry-search" name="q" value="{{ q }}" placeholder="Cari bahan makanan di pantry-mu..."><button class="button" type="submit">Cari</button></div>
<div class="filter-row flex items-center"><span>Filter</span><div class="pills flex" role="group" aria-label="Status kedaluwarsa">
<button name="status" value="" type="submit" class="pill {% if not status %}selected{% endif %}">Semua</button><button name="status" value="soon" type="submit" class="pill {% if status == 'soon' %}selected{% endif %}">Hampir Kadaluarsa</button><button name="status" value="expired" type="submit" class="pill {% if status == 'expired' %}selected{% endif %}">Kadaluarsa</button><button name="status" value="safe" type="submit" class="pill {% if status == 'safe' %}selected{% endif %}">Aman</button></div>
<label class="sr-only" for="location">Lokasi penyimpanan</label><select name="location" id="location" data-auto-submit><option value="">Semua lokasi</option>{% for value,label in locations %}<option {% if location == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select>
<label class="sr-only" for="category">Jenis makanan</label><select name="category" id="category" data-auto-submit><option value="">Semua jenis</option>{% for value,label in categories %}<option {% if category == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></div></form>
<section id="results" aria-label="Bahan makanan" aria-live="polite">{% include 'pantry/cards.html' %}</section>{% endblock %}
