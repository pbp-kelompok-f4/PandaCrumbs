{% load static %}{% if user.is_authenticated %}<form method="post" action="{% url 'recipes:bookmark' recipe.pk %}" data-action="bookmark">{% csrf_token %}<input type="hidden" name="saved" value="{% if saved %}0{% else %}1{% endif %}"><button type="submit" class="bookmark" aria-label="{% if saved %}Hapus bookmark{% else %}Simpan{% endif %} {{ recipe.title }}" aria-pressed="{% if saved %}true{% else %}false{% endif %}"><img src="{% if saved %}{% static 'main/images/recipeDesign-imgContainer1.svg' %}{% else %}{% static 'main/images/recipeDesign-imgContainer2.svg' %}{% endif %}" alt="">{% if saved %}Tersimpan{% else %}Simpan{% endif %}</button></form>{% else %}<a class="bookmark" href="{% url 'login' %}?next={% url 'recipes:detail' recipe.pk %}"><img src="{% static 'main/images/recipeDesign-imgContainer2.svg' %}" alt="">Simpan</a>{% endif %}
